name: Deploy Worker

on:
  push:
    branches:
      - main
      - master
    paths:
      - "worker/**"
      - "worker.js"
      - "scripts/build-worker.mjs"
      - "scripts/worker-build-lib.mjs"
      - "vite.worker.config.js"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # 具名 environment 才留下部署历史、才可能挂审批规则；没有配置保护规则时是空操作。
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 同步漂移、CDN 资源策略、2 MiB 壳上限和 worker.js 新鲜度都只在本地门禁里失败；
      # 放到部署前，才不会变成上线后管理端被 Worker 拒绝。
      - name: Run project checks
        run: npm run check

      - name: Build frontend static assets
        run: npm run build:cdn

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
