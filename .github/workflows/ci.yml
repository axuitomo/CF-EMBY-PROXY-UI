name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 与 engines 下限一致；.npmrc 的 engine-strict 会在这里真正生效
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 与 deploy-worker.yml 用的是同一套门禁，区别是这里在 PR 阶段就失败，
      # 而不是等合入 main 之后由部署流水线来拦。
      - name: Run project checks
        run: npm run check
